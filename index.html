<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Návrh Agendy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        .expandable-content {
            transition: max-height 0.3s ease-in-out, opacity 0.3s ease-in-out, margin 0.3s ease-in-out;
            max-height: 0; opacity: 0; overflow: hidden; margin-top: 0;
        }
        .expandable-content.expanded {
            max-height: 5000px; opacity: 1; overflow: visible; margin-top: 0.75rem;
        }
        .chevron-icon { transition: transform 0.3s ease; }
        .expanded-toggle .chevron-icon { transform: rotate(180deg); }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }

        .step-panel { animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }
        textarea.auto-expand { overflow: hidden; resize: none; min-height: 42px; }

        /* Modal a Toast animace */
        @keyframes slideInUp { from { transform: translateY(100%); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        .toast-enter { animation: slideInUp 0.3s ease-out forwards; }
        @keyframes modalFadeIn { from { opacity: 0; transform: scale(0.95) translateY(-10px); } to { opacity: 1; transform: scale(1) translateY(0); } }
        .modal-enter .modal-content { animation: modalFadeIn 0.2s ease-out forwards; }
        
        /* Loading Overlay */
        #loadingOverlay {
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body class="text-gray-800 p-4 md:p-8 bg-slate-50 relative min-h-screen">

    <!-- Loading Overlay pro načítání dat -->
    <div id="loadingOverlay" class="fixed inset-0 bg-white/80 backdrop-blur-sm z-50 hidden flex flex-col items-center justify-center">
        <i class="fa-solid fa-circle-notch fa-spin text-4xl text-blue-600 mb-4"></i>
        <h2 class="text-lg font-bold text-gray-800">Načítám data ze SharePointu...</h2>
    </div>

    <main class="max-w-4xl mx-auto mt-2">
        <form id="agendaForm">
            
            <!-- KARTA 1: Základní údaje agendy -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-6">
                <div class="space-y-4">
                    <div>
                        <textarea id="agendaName" name="agendaName" required rows="1"
                            class="auto-expand w-full px-0 py-2 text-3xl md:text-4xl font-bold text-gray-900 bg-transparent border-0 focus:ring-0 outline-none transition-colors placeholder-gray-300 resize-none overflow-hidden"
                            placeholder="Název agendy..."></textarea>
                    </div>

                    <div class="bg-gray-50/50 rounded-lg p-1 border border-transparent hover:border-gray-100 transition-colors">
                        <button type="button" class="section-toggle w-full flex items-center justify-between text-sm font-medium text-gray-600 hover:text-blue-600 transition-colors p-2.5 rounded hover:bg-gray-100/80" data-target="agendaDescContainer">
                            <span class="flex items-center gap-2"><i class="fa-solid fa-align-left text-gray-400"></i> Podrobnější popis agendy</span>
                            <i class="fa-solid fa-chevron-down text-xs text-gray-400 chevron-icon"></i>
                        </button>
                        <div id="agendaDescContainer" class="expandable-content px-2 pb-2">
                            <textarea id="agendaDesc" name="agendaDesc" rows="2"
                                class="w-full px-4 py-3 bg-white border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-100 focus:border-blue-400 outline-none transition-all shadow-sm text-sm auto-expand"
                                placeholder="Zde můžete uvést detailní popis celé agendy..."></textarea>
                        </div>
                    </div>

                    <div class="bg-gray-50/50 rounded-lg p-1 mt-2 border border-transparent hover:border-gray-100 transition-colors">
                        <button type="button" class="section-toggle w-full flex items-center justify-between text-sm font-medium text-gray-600 hover:text-blue-600 transition-colors p-2.5 rounded hover:bg-gray-100/80" data-target="recordedDataContainer">
                            <span class="flex items-center gap-2"><i class="fa-solid fa-database text-gray-400"></i> Seznam evidovaných údajů</span>
                            <i class="fa-solid fa-chevron-down text-xs text-gray-400 chevron-icon"></i>
                        </button>
                        <div id="recordedDataContainer" class="expandable-content px-2 pb-2">
                            <div id="recordedDataList" class="space-y-4 mb-3 empty:mb-0 mt-2"></div>
                            <button type="button" id="addRecordedDataBtn" class="text-sm text-blue-600 hover:text-blue-800 font-medium flex items-center gap-2 py-1.5 px-2.5 rounded hover:bg-blue-50 transition-colors mt-2">
                                <i class="fa-solid fa-plus"></i> Přidat údaj
                            </button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- KARTA 2: Kroky Agendy -->
            <div class="bg-white rounded-xl shadow-sm border border-gray-200 p-6 mb-6">
                <div class="flex items-center justify-between mb-6 border-b border-gray-100 pb-4">
                    <h2 class="text-xl font-bold text-gray-800 flex items-center gap-2">Kroky Agendy</h2>
                    <span class="text-sm px-3 py-1 bg-slate-100 rounded-full text-gray-500 font-medium" id="stepCountBadge">0 kroků</span>
                </div>

                <div id="stepsContainer" class="space-y-6">
                    <!-- Dynamicky generované kroky -->
                </div>

                <button type="button" id="addStepBtn" class="mt-8 w-full py-4 border-2 border-dashed border-gray-300 rounded-xl text-gray-500 hover:text-blue-600 hover:border-blue-400 hover:bg-blue-50/50 transition-all flex items-center justify-center gap-2 font-semibold shadow-sm group bg-gray-50/30">
                    <i class="fa-solid fa-plus text-lg group-hover:scale-110 transition-transform"></i> Přidat nový krok
                </button>
            </div>

            <div class="flex justify-end mt-4 mb-10">
                <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white font-medium py-3 px-8 rounded-xl shadow-lg shadow-blue-200 transition-all transform hover:-translate-y-0.5 flex items-center gap-2 disabled:opacity-70 disabled:cursor-not-allowed">
                    <i class="fa-solid fa-cloud-arrow-up"></i> Odeslat do SharePointu
                </button>
            </div>
        </form>
    </main>

    <!-- Toast Notifikace -->
    <div id="toastNotification" class="fixed bottom-5 right-5 bg-gray-800 text-white px-6 py-4 rounded-xl shadow-2xl flex items-center gap-3 hidden z-50 transition-colors duration-300">
        <i class="fa-solid fa-circle-check text-green-400 text-xl toast-icon"></i>
        <div>
            <h4 class="font-bold text-sm toast-title">Úspěšně odesláno</h4>
            <p class="text-xs text-gray-300 toast-msg">Data byla úspěšně uložena.</p>
        </div>
    </div>

    <!-- Custom Delete Modal -->
    <div id="deleteModal" class="fixed inset-0 bg-gray-900/40 backdrop-blur-sm hidden z-50 flex items-center justify-center transition-opacity">
        <div class="modal-content bg-white rounded-xl shadow-2xl w-full max-w-sm mx-4 overflow-hidden">
            <div class="p-6">
                <div class="flex items-center gap-3 mb-4 text-red-600">
                    <div class="bg-red-100 p-2 rounded-full"><i class="fa-solid fa-triangle-exclamation text-xl"></i></div>
                    <h3 class="text-lg font-bold text-gray-900">Potvrzení smazání</h3>
                </div>
                <p class="text-sm text-gray-600 mb-6">Opravdu chcete tuto položku smazat? Tato akce je nevratná.</p>
                <div class="flex items-center justify-end gap-3">
                    <button type="button" id="modalCancelBtn" class="px-4 py-2 text-sm font-medium text-gray-700 bg-gray-100 hover:bg-gray-200 rounded-lg transition-colors">Zrušit</button>
                    <button type="button" id="modalConfirmBtn" class="px-4 py-2 text-sm font-medium text-white bg-red-600 hover:bg-red-700 rounded-lg transition-colors shadow-sm shadow-red-200">Smazat</button>
                </div>
            </div>
        </div>
    </div>

<script>
        // --- KONFIGURACE APIM ADRES ---
        const POST_LOGIC_APP_URL = "https://api-krabicky.azure-api.net/ulozeni-popisu-agendy/Prijmout_HTTP_pozadavek_z_formulare/paths/invoke";
        const GET_LOGIC_APP_URL = "https://api-krabicky.azure-api.net/nacteni-popisu-agendy/Prijmout_HTTP_pozadavek/paths/invoke";
        const SP_DOCS_BASE_URL = "https://carachosro.sharepoint.com/sites/Agendy/dokumenty_agend";
        // ------------------------------

        // Globální pole pro evidenci souborů určených ke smazání ze SharePointu (drží serverFileName)
        let deletedFiles = [];

        // Generování unikátního úložištního názvu s čistým GUIDem před příponou
        function generateServerFileName(originalName) {
            const guid = (typeof crypto !== 'undefined' && crypto.randomUUID) 
                ? crypto.randomUUID() 
                : 'guid_' + Math.random().toString(36).substring(2, 11);
            const lastDot = originalName.lastIndexOf('.');
            if (lastDot === -1) return `${originalName}_${guid}`;
            const base = originalName.substring(0, lastDot);
            const ext = originalName.substring(lastDot);
            return `${base}_${guid}${ext}`;
        }

        function fileToBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => {
                    const base64String = reader.result.split(',')[1];
                    resolve(base64String);
                };
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        }
        
        function sanitizeJsonString(str) {
            let result = '';
            let inString = false;
            let escaped = false;
            for (let i = 0; i < str.length; i++) {
                const char = str[i];
                if (inString) {
                    if (escaped) {
                        result += char;
                        escaped = false;
                    } else if (char === '\\') {
                        result += char;
                        escaped = true;
                    } else if (char === '"') {
                        result += char;
                        inString = false;
                    } else if (char === '\n') {
                        result += '\\n';
                    } else if (char === '\r') {
                        result += '\\r';
                    } else if (char === '\t') {
                        result += '\\t';
                    } else if (char.charCodeAt(0) < 32) {
                        result += '\\u' + char.charCodeAt(0).toString(16).padStart(4, '0');
                    } else {
                        result += char;
                    }
                } else {
                    if (char === '"') {
                        inString = true;
                    }
                    result += char;
                }
            }
            return result;
        }

        document.addEventListener('DOMContentLoaded', () => {
            const stepsContainer = document.getElementById('stepsContainer');
            const addStepBtn = document.getElementById('addStepBtn');
            const stepCountBadge = document.getElementById('stepCountBadge');
            const agendaForm = document.getElementById('agendaForm');
            const toast = document.getElementById('toastNotification');
            const loadingOverlay = document.getElementById('loadingOverlay');
            const recordedDataList = document.getElementById('recordedDataList');
            const addRecordedDataBtn = document.getElementById('addRecordedDataBtn');
            
            // Inicializace načítání z URL
            const urlParams = new URLSearchParams(window.location.search);
            let currentRecordId = urlParams.get('id');
            
            if (currentRecordId) {
                loadRecordData(currentRecordId);
            } else {
                addStep();
            }

            async function loadRecordData(id) {
                loadingOverlay.classList.remove('hidden');
                console.log("--> Načítám data pro ID:", id);
                try {
                    const response = await fetch(`${GET_LOGIC_APP_URL}/${id}`);
                    if (!response.ok) throw new Error("Chyba při načítání dat ze SharePointu.");
                    
                    const textData = await response.text();
                    const sanitized = sanitizeJsonString(textData);
                    let parsedData = JSON.parse(sanitized);
                    
                    if (typeof parsedData === 'string') {
                        parsedData = JSON.parse(sanitizeJsonString(parsedData));
                    }
                    
                    const actualData = parsedData.detail ? parsedData.detail : parsedData;
                    populateForm(actualData, id);
                } catch (err) {
                    console.error("Chyba stahování:", err);
                    showToast("Chyba načítání", "Nepodařilo se stáhnout data ze serveru.", true);
                    addStep();
                } finally {
                    loadingOverlay.classList.add('hidden');
                }
            }

            function populateForm(data, agendaId) {
                // 1. Základní údaje agendy
                if (data.agenda) {
                    const nameEl = document.getElementById('agendaName');
                    const descEl = document.getElementById('agendaDesc');
                    if (nameEl) nameEl.value = data.agenda.name || '';
                    if (descEl) descEl.value = data.agenda.description || '';
                    autoExpand(nameEl);
                    autoExpand(descEl);
                    
                    if (data.agenda.description) {
                        const targetEl = document.getElementById('agendaDescContainer');
                        const toggleBtn = document.querySelector(`[data-target="agendaDescContainer"]`);
                        if (targetEl && toggleBtn) {
                            targetEl.classList.add('expanded');
                            toggleBtn.classList.add('expanded-toggle', 'text-blue-700', 'bg-blue-50/50');
                            toggleBtn.classList.remove('text-gray-600');
                        }
                    }
                }

                recordedDataList.innerHTML = '';
                stepsContainer.innerHTML = '';
                deletedFiles = [];

                // 2. Evidované údaje
                if (data.recordedData && data.recordedData.length > 0) {
                    const targetEl = document.getElementById('recordedDataContainer');
                    const toggleBtn = document.querySelector(`[data-target="recordedDataContainer"]`);
                    if (targetEl && toggleBtn) {
                        targetEl.classList.add('expanded');
                        toggleBtn.classList.add('expanded-toggle', 'text-blue-700', 'bg-blue-50/50');
                        toggleBtn.classList.remove('text-gray-600');
                    }

                    data.recordedData.forEach(rd => {
                        addRecordedData();
                        const rows = recordedDataList.querySelectorAll('.recorded-data-row');
                        const lastRow = rows[rows.length - 1];
                        
                        lastRow.querySelector('.r-data-name').value = rd.name || '';
                        lastRow.querySelector('.r-data-col').value = rd.columnName || '';
                        if (rd.columnName) lastRow.querySelector('.r-data-col').dataset.manualEdit = 'true';
                        lastRow.querySelector('.r-data-type').value = rd.dataType || 'Jeden řádek textu';
                        lastRow.querySelector('.r-data-source').value = rd.source || '';
                        lastRow.querySelector('.r-data-desc').value = rd.description || '';
                        
                        autoExpand(lastRow.querySelector('.r-data-source'));
                        autoExpand(lastRow.querySelector('.r-data-desc'));
                    });
                }

                // 3. Kroky
                if (data.steps && data.steps.length > 0) {
                    data.steps.forEach(step => {
                        addStep(null, step.id);
                        const card = document.getElementById(step.id);
                        if (!card) return;
                        
                        card.querySelector('.step-name-input').value = step.name || '';
                        card.querySelector('.step-desc-input').value = step.description || '';
                        autoExpand(card.querySelector('.step-desc-input'));

                        // Formulář kroku
                        if (step.formFile) {
                            const isObj = typeof step.formFile === 'object';
                            const displayName = isObj ? step.formFile.name : step.formFile;
                            const serverName = (isObj && step.formFile.serverFileName) ? step.formFile.serverFileName : displayName;
                            const fileUrl = `${SP_DOCS_BASE_URL}/${agendaId}/${encodeURIComponent(serverName)}`;
                            
                            const formPanel = card.querySelector(`#form-${step.id}`);
                            if (formPanel) {
                                formPanel.dataset.existingDisplayName = displayName;
                                formPanel.dataset.existingServerName = serverName;
                                formPanel.dataset.existingFileUrl = fileUrl;
                                
                                const previewContainer = formPanel.querySelector('.existing-file-preview') || document.createElement('div');
                                previewContainer.className = 'existing-file-preview flex items-center justify-between p-2 mb-2 bg-blue-50 border border-blue-200 rounded-md text-sm text-blue-900';
                                previewContainer.innerHTML = `
                                    <div class="flex items-center gap-2 truncate">
                                        <i class="fa-solid fa-file-lines text-blue-600"></i>
                                        <a href="${fileUrl}" target="_blank" rel="noopener noreferrer" class="font-medium hover:underline flex items-center gap-1.5 text-blue-700 truncate" title="Otevřít v nové záložce">
                                            <span>${displayName}</span>
                                            <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                                        </a>
                                    </div>
                                    <div class="flex items-center gap-2 shrink-0 ml-2">
                                        <span class="text-[11px] text-blue-500 font-normal">(SharePoint)</span>
                                        <button type="button" class="remove-existing-formfile-btn text-gray-400 hover:text-red-600 p-1 rounded hover:bg-red-50 transition-colors" title="Smazat soubor ze SharePointu">
                                            <i class="fa-solid fa-trash-can text-xs"></i>
                                        </button>
                                    </div>
                                `;
                                const inputWrapper = formPanel.querySelector('.flex.items-center.gap-4');
                                if (inputWrapper && !formPanel.querySelector('.existing-file-preview')) {
                                    formPanel.insertBefore(previewContainer, inputWrapper);
                                }
                            }
                        }

                        // Vstupy
                        if (step.inputs && step.inputs.length > 0) {
                            const inputsList = card.querySelector(`#inputs-${step.id} .io-list`);
                            step.inputs.forEach(io => {
                                const tempDiv = document.createElement('div');
                                tempDiv.innerHTML = createIORowHTML('Vstup');
                                const row = tempDiv.firstElementChild;
                                const nameInput = row.querySelector('.io-name-input');
                                nameInput.value = io.name || '';
                                
                                if (io.name) {
                                    const fileWrapper = row.querySelector('.io-file-wrapper');
                                    const fileInput = row.querySelector('.io-file-input');
                                    if (fileInput && fileWrapper) {
                                        fileInput.disabled = false;
                                        fileInput.classList.remove('cursor-not-allowed', 'text-gray-400');
                                        fileInput.classList.add('cursor-pointer', 'text-gray-500');
                                        fileWrapper.classList.remove('opacity-50', 'bg-gray-50', 'border-gray-200');
                                        fileWrapper.classList.add('bg-white', 'border-gray-300');
                                    }
                                }

                                if (io.files && io.files.length > 0) {
                                    const fileListContainer = row.querySelector('.file-list-container');
                                    fileListContainer.classList.remove('hidden');
                                    row._existingFiles = [];

                                    io.files.forEach(f => {
                                        const isObj = typeof f === 'object';
                                        const displayName = isObj ? f.name : f;
                                        const serverName = (isObj && f.serverFileName) ? f.serverFileName : displayName;
                                        const fileUrl = `${SP_DOCS_BASE_URL}/${agendaId}/${encodeURIComponent(serverName)}`;
                                        
                                        row._existingFiles.push({ name: displayName, serverFileName: serverName, url: fileUrl });

                                        const li = document.createElement('li');
                                        li.className = "flex items-center justify-between bg-blue-50/70 px-2 py-1.5 rounded border border-blue-100 mb-1 existing-io-file-item";
                                        li.dataset.serverFileName = serverName;
                                        li.dataset.displayName = displayName;
                                        li.innerHTML = `
                                            <a href="${fileUrl}" target="_blank" rel="noopener noreferrer" class="truncate mr-2 text-blue-700 hover:underline flex items-center gap-1.5">
                                                <i class="fa-solid fa-paperclip text-[10px]"></i>
                                                <span class="truncate">${displayName}</span>
                                                <i class="fa-solid fa-arrow-up-right-from-square text-[9px] text-blue-500"></i>
                                            </a>
                                            <div class="flex items-center gap-1 shrink-0 ml-2">
                                                <span class="text-[10px] text-blue-400">(SharePoint)</span>
                                                <button type="button" class="remove-existing-iofile-btn text-gray-400 hover:text-red-600 p-1 rounded hover:bg-red-50 transition-colors" title="Smazat soubor ze SharePointu">
                                                    <i class="fa-solid fa-trash-can text-xs"></i>
                                                </button>
                                            </div>
                                        `;
                                        fileListContainer.appendChild(li);
                                    });
                                }
                                inputsList.appendChild(row);
                            });
                        }

                        // Výstupy
                        if (step.outputs && step.outputs.length > 0) {
                            const outputsList = card.querySelector(`#outputs-${step.id} .io-list`);
                            step.outputs.forEach(io => {
                                const tempDiv = document.createElement('div');
                                tempDiv.innerHTML = createIORowHTML('Výstup');
                                const row = tempDiv.firstElementChild;
                                const nameInput = row.querySelector('.io-name-input');
                                nameInput.value = io.name || '';
                                
                                if (io.name) {
                                    const fileWrapper = row.querySelector('.io-file-wrapper');
                                    const fileInput = row.querySelector('.io-file-input');
                                    if (fileInput && fileWrapper) {
                                        fileInput.disabled = false;
                                        fileInput.classList.remove('cursor-not-allowed', 'text-gray-400');
                                        fileInput.classList.add('cursor-pointer', 'text-gray-500');
                                        fileWrapper.classList.remove('opacity-50', 'bg-gray-50', 'border-gray-200');
                                        fileWrapper.classList.add('bg-white', 'border-gray-300');
                                    }
                                }

                                if (io.files && io.files.length > 0) {
                                    const fileListContainer = row.querySelector('.file-list-container');
                                    fileListContainer.classList.remove('hidden');
                                    row._existingFiles = [];

                                    io.files.forEach(f => {
                                        const isObj = typeof f === 'object';
                                        const displayName = isObj ? f.name : f;
                                        const serverName = (isObj && f.serverFileName) ? f.serverFileName : displayName;
                                        const fileUrl = `${SP_DOCS_BASE_URL}/${agendaId}/${encodeURIComponent(serverName)}`;
                                        
                                        row._existingFiles.push({ name: displayName, serverFileName: serverName, url: fileUrl });

                                        const li = document.createElement('li');
                                        li.className = "flex items-center justify-between bg-emerald-50/70 px-2 py-1.5 rounded border border-emerald-100 mb-1 existing-io-file-item";
                                        li.dataset.serverFileName = serverName;
                                        li.dataset.displayName = displayName;
                                        li.innerHTML = `
                                            <a href="${fileUrl}" target="_blank" rel="noopener noreferrer" class="truncate mr-2 text-emerald-700 hover:underline flex items-center gap-1.5">
                                                <i class="fa-solid fa-paperclip text-[10px]"></i>
                                                <span class="truncate">${displayName}</span>
                                                <i class="fa-solid fa-arrow-up-right-from-square text-[9px] text-emerald-500"></i>
                                            </a>
                                            <div class="flex items-center gap-1 shrink-0 ml-2">
                                                <span class="text-[10px] text-emerald-400">(SharePoint)</span>
                                                <button type="button" class="remove-existing-iofile-btn text-gray-400 hover:text-red-600 p-1 rounded hover:bg-red-50 transition-colors" title="Smazat soubor ze SharePointu">
                                                    <i class="fa-solid fa-trash-can text-xs"></i>
                                                </button>
                                            </div>
                                        `;
                                        fileListContainer.appendChild(li);
                                    });
                                }
                                outputsList.appendChild(row);
                            });
                        }
                    });

                    updateUI();

                    // Navazující kroky
                    data.steps.forEach(step => {
                        const card = document.getElementById(step.id);
                        if (!card) return;

                        if (step.nextSteps && step.nextSteps.length > 0) {
                            const nextList = card.querySelector(`#next-${step.id} .next-steps-list`);
                            step.nextSteps.forEach(ns => {
                                const tempDiv = document.createElement('div');
                                tempDiv.innerHTML = createNextStepRowHTML();
                                const row = tempDiv.firstElementChild;
                                
                                const select = row.querySelector('.next-step-select');
                                select.innerHTML = card.querySelector('.next-step-select')?.innerHTML || select.innerHTML;
                                select.value = ns.targetStepId || '';
                                
                                const condInput = row.querySelector('.condition-input');
                                condInput.value = ns.condition || '';
                                
                                if (select.value !== '') {
                                    const container = row.querySelector('.condition-container');
                                    container.classList.remove('opacity-50', 'pointer-events-none');
                                    condInput.classList.remove('bg-gray-100');
                                    condInput.classList.add('bg-white');
                                    autoExpand(condInput);
                                }
                                
                                nextList.appendChild(row);

                        }

                    icon.className = 'fa-solid fa-triangle-exclamation text-white text-xl toast-icon';
                } else {

                    icon.className = 'fa-solid fa-circle-check text-green-400 text-xl toast-icon';
                }
                toast.querySelector('.toast-title').textContent = title;
                toast.querySelector('.toast-msg').textContent = message;
                toast.classList.remove('hidden');

            // --- EXPORT DAT DO LOGIC APP (POST) ---
            agendaForm.addEventListener('submit', async (e) => {
                e.preventDefault();
                
                const submitBtn = e.target.querySelector('button[type="submit"]');
                const originalBtnContent = submitBtn.innerHTML;
                submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Zpracovávám a odesílám...';
                submitBtn.disabled = true;

                try {
                    const allNewFiles = [];

                    // 1. ČISTÝ DETAIL BEZ BASE64 PRO SHAREPOINT SEZNAM
                    const cleanDetail = {
                        agenda: {
                            name: document.getElementById('agendaName')?.value || '',
                            description: document.getElementById('agendaDesc')?.value || ''
                        },
                        recordedData: [],
                        steps: []
                    };

                    document.querySelectorAll('.recorded-data-row').forEach(row => {
                        cleanDetail.recordedData.push({
                            name: row.querySelector('.r-data-name')?.value || '',
                            columnName: row.querySelector('.r-data-col')?.value || '',
                            dataType: row.querySelector('.r-data-type')?.value || '',
                            source: row.querySelector('.r-data-source')?.value || '',
                            description: row.querySelector('.r-data-desc')?.value || ''
                        });
                    });

                    const stepCards = Array.from(document.querySelectorAll('.step-card'));
                    for (const card of stepCards) {
                        const stepId = card.id;
                        const stepName = card.querySelector('.step-name-input')?.value || '';
                        const stepDesc = card.querySelector('.step-desc-input')?.value || '';
                        
                        // Formulář kroku
                        const formPanel = card.querySelector(`#form-${stepId}`);
                        const formInput = card.querySelector('.step-form-input');
                        let formFileData = null;

                        if (formInput && formInput.files.length > 0) {
                            const file = formInput.files[0];
                            const base64 = await fileToBase64(file);
                            const serverFileName = generateServerFileName(file.name);
                            
                            // Do detailu čistý název a serverFileName
                            formFileData = { 
                                name: file.name,
                                serverFileName: serverFileName
                            };
                            
                            // Binárka jde do allNewFiles s unikátním GUID názvem
                            allNewFiles.push({
                                name: serverFileName,
                                contentBytes: base64,
                                contentType: file.type || 'application/octet-stream'
                            });
                        } else if (formPanel && formPanel.dataset.existingServerName) {
                            formFileData = {
                                name: formPanel.dataset.existingDisplayName,
                                serverFileName: formPanel.dataset.existingServerName,
                                url: formPanel.dataset.existingFileUrl
                            };
                        }

                        // Vstupy a Výstupy
                        const extractIOAsync = async (typeId) => {
                            const ioData = [];
                            const rows = Array.from(card.querySelectorAll(`#${typeId}-${stepId} .io-row`));
                            for (const row of rows) {
                                const name = row.querySelector('.io-name-input')?.value.trim() || '';
                                const filesInput = row.querySelector('.io-file-input');
                                const filesList = [];

                                // Zachováme stávající soubory
                                if (row._existingFiles) {
                                    row._existingFiles.forEach(ef => filesList.push({
                                        name: ef.name,
                                        serverFileName: ef.serverFileName,
                                        url: ef.url
                                    }));
                                }

                                // Zpracujeme nově vybrané soubory
                                if (filesInput && filesInput.files.length > 0) {
                                    for (const file of Array.from(filesInput.files)) {
                                        const base64 = await fileToBase64(file);
                                        const serverFileName = generateServerFileName(file.name);
                                        
                                        // Do detailu čistý zobrazovaný i serverový název
                                        filesList.push({ 
                                            name: file.name,
                                            serverFileName: serverFileName
                                        });

                                        // Binárka jde s unikátním GUID názvem
                                        allNewFiles.push({
                                            name: serverFileName,
                                            contentBytes: base64,
                                            contentType: file.type || 'application/octet-stream'
                                        });
                                    }
                                }

                                if (name) {
                                    ioData.push({ name, files: filesList });
                                }
                            }
                            return ioData;
                        };

                        const inputsData = await extractIOAsync('inputs');
                        const outputsData = await extractIOAsync('outputs');

                        const nextSteps = [];
                        card.querySelectorAll(`#next-${stepId} .next-step-row`).forEach(row => {
                            const targetId = row.querySelector('.next-step-select')?.value || '';
                            const condition = row.querySelector('.condition-input')?.value || '';
                            if (targetId) nextSteps.push({ targetStepId: targetId, condition });
                        });

                        cleanDetail.steps.push({
                            id: stepId,
                            name: stepName,
                            description: stepDesc,
                            formFile: formFileData,
                            inputs: inputsData,
                            outputs: outputsData,
                            nextSteps: nextSteps
                        });
                    }

                    // 2. FINÁLNÍ PAYLOAD
                    const payload = {
                        id: currentRecordId || null,
                        detail: cleanDetail,
                        files: allNewFiles,
                        deletedFiles: Array.from(new Set(deletedFiles))
                    };

                    const response = await fetch(POST_LOGIC_APP_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });

                    if (response.ok) {
                        const resData = await response.json();
                        showToast("Úspěšně uloženo", "Data agendy i soubory byly v pořádku odeslány do SharePointu.");
                        deletedFiles = [];
                        
                        if (resData.id && !currentRecordId) {
                            currentRecordId = String(resData.id);
                            const newUrl = `${window.location.protocol}//${window.location.host}${window.location.pathname}?id=${currentRecordId}`;
                            window.history.replaceState({ path: newUrl }, '', newUrl);
                        }
                    } else {
                        throw new Error(`Kód: ${response.status}`);
                    }
                } catch (error) {
                    console.error("Chyba při odesílání dat:", error);
                    showToast("Chyba odeslání", "Nepodařilo se uložit data se soubory.", true);
                } finally {
                    submitBtn.innerHTML = originalBtnContent;
                    submitBtn.disabled = false;
                }
            });

            function bindMainToggles() {
                const toggleBtns = document.querySelectorAll('.section-toggle');
                toggleBtns.forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        const targetId = e.currentTarget.getAttribute('data-target');
                        const targetEl = document.getElementById(targetId);
                        if (targetEl) {
                            targetEl.classList.toggle('expanded');
                            e.currentTarget.classList.toggle('expanded-toggle');
                            if (targetEl.classList.contains('expanded')) {
                                e.currentTarget.classList.add('text-blue-700', 'bg-blue-50/50');
                                e.currentTarget.classList.remove('text-gray-600');
                            } else {
                                e.currentTarget.classList.remove('text-blue-700', 'bg-blue-50/50');
                                e.currentTarget.classList.add('text-gray-600');
                            }
                        }
                    });
                });
            }

            function checkPanelDataAndUpdateIcon(panelEl) {
                if (!panelEl) return;
                const panelId = panelEl.id;
                const stepCard = panelEl.closest('.step-card');
                const iconBtn = stepCard.querySelector(`[data-target="${panelId}"]`);
                if (!iconBtn) return;

                let hasData = false;
                let countToShow = 0;

                if (panelId.startsWith('inputs-') || panelId.startsWith('outputs-')) {
                    panelEl.querySelectorAll('.io-row').forEach(row => {
                        if (row.querySelector('.io-name-input')?.value.trim() !== '') countToShow++;
                    });
                    if (countToShow > 0) hasData = true;
                } else {
                    panelEl.querySelectorAll('textarea, input[type="text"]:not(.io-name-input)').forEach(input => {
                        if (input.value.trim() !== '' && !input.closest('.condition-container.opacity-50')) hasData = true;
                    });
                    panelEl.querySelectorAll('input[type="file"]:not(.io-file-input)').forEach(input => {
                        if (input.files.length > 0 || panelEl.dataset.existingServerName) hasData = true;
                    });
                    panelEl.querySelectorAll('select.next-step-select').forEach(select => {
                        if (select.value !== '') hasData = true;
                    });
                }

                const indicator = iconBtn.querySelector('.data-indicator');
                if (hasData) {
                    indicator.classList.remove('hidden');
                    iconBtn.classList.add('ring-2', 'ring-blue-300');
                    if (countToShow > 0) indicator.textContent = countToShow;
                    else indicator.innerHTML = '<i class="fa-solid fa-check text-[10px]"></i>';
                } else {
                    indicator.classList.add('hidden');
                    iconBtn.classList.remove('ring-2', 'ring-blue-300');
                    indicator.textContent = '';
                }
            }

            function autoExpand(textarea) {
                if (!textarea) return;
                textarea.style.height = '42px';
                textarea.style.height = textarea.scrollHeight + 'px';
            }

            document.addEventListener('input', (e) => {
                if (e.target.classList.contains('auto-expand')) autoExpand(e.target);
                if (e.target.classList.contains('data-input')) checkPanelDataAndUpdateIcon(e.target.closest('.step-panel'));
                if (e.target.classList.contains('step-name-input')) updateAllDropdowns();
                if (e.target.classList.contains('r-data-name')) {
                    const row = e.target.closest('.recorded-data-row');
                    const colInput = row.querySelector('.r-data-col');
                    if (colInput && !colInput.dataset.manualEdit) {
                        colInput.value = e.target.value.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/\s+/g, "_").toLowerCase().replace(/[^a-z0-9_]/g, "");           
                    }
                }
                if (e.target.classList.contains('r-data-col')) e.target.dataset.manualEdit = 'true';

                // Validace: Odemčení / uzamčení souborů podle vyplnění názvu vstupu/výstupu
                if (e.target.classList.contains('io-name-input')) {
                    const row = e.target.closest('.io-row');
                    const fileWrapper = row.querySelector('.io-file-wrapper');
                    const fileInput = row.querySelector('.io-file-input');
                    const fileList = row.querySelector('.file-list-container');
                    const hasValue = e.target.value.trim().length > 0;

                    if (hasValue) {
                        fileInput.disabled = false;
                        fileInput.classList.remove('cursor-not-allowed', 'text-gray-400');
                        fileInput.classList.add('cursor-pointer', 'text-gray-500');
                        fileWrapper.classList.remove('opacity-50', 'bg-gray-50', 'border-gray-200');
                        fileWrapper.classList.add('bg-white', 'border-gray-300');
                    } else {
                        fileInput.disabled = true;
                        fileInput.value = '';
                        fileInput._dt = new DataTransfer();
                        fileInput.classList.add('cursor-not-allowed', 'text-gray-400');
                        fileInput.classList.remove('cursor-pointer', 'text-gray-500');
                        fileWrapper.classList.add('opacity-50', 'bg-gray-50', 'border-gray-200');
                        fileWrapper.classList.remove('bg-white', 'border-gray-300');
                        if (fileList) {
                            fileList.innerHTML = '';
                            fileList.classList.add('hidden');
                        }
                    }
                }
            });

            document.addEventListener('change', (e) => {
                if (e.target.type === 'file' && e.target.classList.contains('io-file-input')) {
                    const fileListContainer = e.target.closest('.flex-1').querySelector('.file-list-container');
                    fileListContainer.innerHTML = '';
                    if (!e.target._dt) e.target._dt = new DataTransfer();
                    if (e.isTrusted) Array.from(e.target.files).forEach(file => e.target._dt.items.add(file));
                    e.target.files = e.target._dt.files;
                    if (e.target.files.length > 0) {
                        fileListContainer.classList.remove('hidden');
                        Array.from(e.target.files).forEach((file, index) => {
                            const li = document.createElement('li');
                            li.className = "flex items-center justify-between bg-gray-50 px-2 py-1.5 rounded border border-gray-100 mb-1";
                            li.innerHTML = `<span class="truncate mr-2">${file.name}</span><button type="button" class="text-gray-400 hover:text-red-500 p-0.5 remove-individual-file-btn" data-index="${index}"><i class="fa-solid fa-times"></i></button>`;
                            fileListContainer.appendChild(li);
                        });
                    } else {
                        fileListContainer.classList.add('hidden');
                    }
                }
                if (e.target.classList.contains('data-input')) checkPanelDataAndUpdateIcon(e.target.closest('.step-panel'));
                if (e.target.classList.contains('next-step-select')) {
                    const row = e.target.closest('.next-step-row');
                    const condContainer = row.querySelector('.condition-container');
                    const condInput = row.querySelector('.condition-input');
                    if (e.target.value !== "") {
                        condContainer.classList.remove('opacity-50', 'pointer-events-none');
                        condInput.classList.remove('bg-gray-100');
                        condInput.classList.add('bg-white');
                    } else {
                        condContainer.classList.add('opacity-50', 'pointer-events-none');
                        condInput.classList.add('bg-gray-100');
                        condInput.classList.remove('bg-white');
                        condInput.value = "";
                        autoExpand(condInput);
                    }
                    checkPanelDataAndUpdateIcon(e.target.closest('.step-panel'));
                }
            });

            stepsContainer.addEventListener('click', (e) => {
                const iconBtn = e.target.closest('.icon-tab-btn');
                if (iconBtn) {
                    const targetPanel = document.getElementById(iconBtn.getAttribute('data-target'));
                    if (targetPanel.classList.contains('hidden')) {
                        targetPanel.classList.remove('hidden');
                        iconBtn.classList.add('bg-blue-100', 'border-blue-300');
                        targetPanel.querySelectorAll('textarea.auto-expand').forEach(ta => autoExpand(ta));
                    } else {
                        targetPanel.classList.add('hidden');
                        iconBtn.classList.remove('bg-blue-100', 'border-blue-300');
                    }
                    return; 
                }

                const actions = {
                    '.delete-step-btn': btn => showDeleteModal(() => { 
                        const card = btn.closest('.step-card');
                        const formPanel = card.querySelector('[id^="form-"]');
                        if (formPanel && formPanel.dataset.existingServerName) {
                            deletedFiles.push(formPanel.dataset.existingServerName);
                        }
                        card.querySelectorAll('.existing-io-file-item').forEach(item => {
                            if (item.dataset.serverFileName) deletedFiles.push(item.dataset.serverFileName);
                        });

                        card.remove(); 
                        updateUI(); 
                    }),
                    '.insert-before-btn': btn => addStep(btn.closest('.step-card')),
                    '.insert-after-btn': btn => addStep(btn.closest('.step-card').nextElementSibling),
                    '.add-io-btn': btn => {
                        const div = document.createElement('div');
                        div.innerHTML = createIORowHTML(btn.getAttribute('data-type'));
                        btn.previousElementSibling.appendChild(div.firstElementChild);
                        checkPanelDataAndUpdateIcon(btn.closest('.step-panel'));
                    },
                    '.remove-io-btn': btn => { 
                        const row = btn.closest('.io-row');
                        const p = btn.closest('.step-panel');
                        if (row._existingFiles) {
                            row._existingFiles.forEach(f => deletedFiles.push(f.serverFileName));
                        }
                        row.remove(); 
                        checkPanelDataAndUpdateIcon(p); 
                    },
                    '.add-next-step-btn': btn => {
                        const div = document.createElement('div');
                        div.innerHTML = createNextStepRowHTML();
                        btn.previousElementSibling.appendChild(div.firstElementChild);
                        updateAllDropdowns();
                    },
                    '.remove-next-step': btn => { const p = btn.closest('.step-panel'); btn.closest('.next-step-row').remove(); checkPanelDataAndUpdateIcon(p); },
                    
                    // Smazání formuláře kroku
                    '.remove-existing-formfile-btn': btn => {
                        const formPanel = btn.closest('[id^="form-"]');
                        if (formPanel && formPanel.dataset.existingServerName) {
                            deletedFiles.push(formPanel.dataset.existingServerName);
                            delete formPanel.dataset.existingDisplayName;
                            delete formPanel.dataset.existingServerName;
                            delete formPanel.dataset.existingFileUrl;
                        }
                        const preview = formPanel.querySelector('.existing-file-preview');
                        if (preview) preview.remove();
                        checkPanelDataAndUpdateIcon(formPanel);
                    },

                    // Smazání vstupu/výstupu
                    '.remove-existing-iofile-btn': btn => {
                        const li = btn.closest('.existing-io-file-item');
                        const row = btn.closest('.io-row');
                        const p = btn.closest('.step-panel');
                        const serverFileName = li.dataset.serverFileName;

                        if (serverFileName) {
                            deletedFiles.push(serverFileName);
                            if (row._existingFiles) {
                                row._existingFiles = row._existingFiles.filter(f => f.serverFileName !== serverFileName);
                            }
                        }
                        li.remove();
                        checkPanelDataAndUpdateIcon(p);
                    }
                };

                for (const selector in actions) {
                    const btn = e.target.closest(selector);
                    if (btn) return actions[selector](btn);
                }
            });

            function addStep(beforeElement = null, forceId = null) {
                const stepId = forceId || generateUniqueId();
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = createStepHTML(stepId);
                const stepEl = tempDiv.firstElementChild;
                if (beforeElement) stepsContainer.insertBefore(stepEl, beforeElement);
                else stepsContainer.appendChild(stepEl);
                updateUI();
                if (!forceId) setTimeout(() => stepEl.querySelector('.step-name-input').focus(), 100);
            }

            function updateUI() {
                const count = stepsContainer.querySelectorAll('.step-card').length;
                stepCountBadge.textContent = count === 1 ? '1 krok' : (count >= 2 && count <= 4 ? `${count} kroky` : `${count} kroků`);
                updateAllDropdowns();
            }

            function updateAllDropdowns() {
                const steps = Array.from(stepsContainer.querySelectorAll('.step-card')).map((card, i) => ({
                    id: card.id, name: card.querySelector('.step-name-input').value.trim() || `(Nepojmenovaný krok ${i + 1})`
                }));
                document.querySelectorAll('.next-step-select').forEach(select => {
                    const currentVal = select.value;
                    const parentId = select.closest('.step-card').id;
                    select.innerHTML = '<option value="">-- Vyberte krok --</option>';
                    steps.forEach(s => {
                        if (s.id !== parentId) {
                            const opt = document.createElement('option');
                            opt.value = s.id; opt.textContent = s.name;
                            if (s.id === currentVal) opt.selected = true;
                            select.appendChild(opt);
                        }
                    });
                });
            }

            bindMainToggles();
            addStepBtn.addEventListener('click', () => addStep());

            function addRecordedData(beforeElement = null) {
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = createRecordedDataHTML();
                if (beforeElement) recordedDataList.insertBefore(tempDiv.firstElementChild, beforeElement);
                else recordedDataList.appendChild(tempDiv.firstElementChild);
            }
            if (addRecordedDataBtn) addRecordedDataBtn.addEventListener('click', () => addRecordedData());

            document.addEventListener('click', (e) => {
                const act = {
                    '.delete-data-btn': btn => showDeleteModal(() => btn.closest('.recorded-data-row').remove()),
                    '.insert-data-before-btn': btn => addRecordedData(btn.closest('.recorded-data-row')),
                    '.insert-data-after-btn': btn => addRecordedData(btn.closest('.recorded-data-row').nextElementSibling),
                    '.remove-individual-file-btn': btn => {
                        const input = btn.closest('.io-row').querySelector('.io-file-input');
                        if (input._dt) {
                            input._dt.items.remove(parseInt(btn.dataset.index, 10));
                            input.files = input._dt.files;
                            input.dispatchEvent(new Event('change', { bubbles: true }));
                        }
                    }
                };
                for (const selector in act) {
                    const btn = e.target.closest(selector);
                    if (btn) return act[selector](btn);
                }
            });
        });
    </script>
</body>
</html>
